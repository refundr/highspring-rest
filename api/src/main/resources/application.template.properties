GOOGLE_CLIENT_ID=replace-me
GOOGLE_CLIENT_SECRET=replace-me

ADMIN_EMAILS=you@example.com
DEVELOPER_ALERT_EMAIL=you@example.com

MAIL_MODE=logging
SMTP_HOST=localhost
SMTP_PORT=587
SMTP_USERNAME=
SMTP_PASSWORD=
SMTP_FROM=highspring@localhost

SERVER_HOST=0.0.0.0
SERVER_PORT=8090
CORS_ORIGINS=http://localhost:3000

